name: Validate skill

on:
  pull_request:
  push:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/validate_skill.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_source_urls.py
